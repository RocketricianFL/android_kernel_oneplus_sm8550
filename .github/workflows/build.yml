name: Build OP11 crDroid 16.0 Kernel (KSU-Next + SUSFS + NetHunter)

on:
  push:
    branches: [ "16.0" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Runner Disk Space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android

      - name: Install Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libelf-dev python3 python-is-python3 zip unzip wget zstd lz4 pahole openjdk-17-jdk gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Checkout crDroid 16.0 Kernel Source
        uses: actions/checkout@v4
        with:
          ref: "16.0"
          submodules: recursive
          fetch-depth: 1

      - name: Download Proton Clang Toolchain
        uses: actions/checkout@v4
        with:
          repository: kdrag0n/proton-clang
          path: clang-toolchain
          fetch-depth: 1

      - name: Link Clang Toolchain
        run: mv clang-toolchain $HOME/clang

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-op11-crdroid16-${{ github.sha }}
          restore-keys: |
            ccache-op11-crdroid16-

      - name: Configure ccache Environment
        run: |
          export CCACHE_DIR="$HOME/.ccache"
          ccache -M 5G
          ccache -z
          ccache -s

      - name: Integrate KernelSU-Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Integrate SUSFS (5.15)
        run: |
          git clone --depth=1 -b gki-android13-5.15 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu ||           git clone --depth=1 -b kernel-5.15 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
          cp -r ../susfs4ksu/kernel_patches/fs/* fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          SUSFS_PATCH=$(find ../susfs4ksu/kernel_patches -maxdepth 1 -name "50_add_susfs_*.patch" | head -n 1)
          if [ -n "$SUSFS_PATCH" ]; then
            echo "Applying $SUSFS_PATCH..."
            patch -p1 --fuzz=3 < "$SUSFS_PATCH" || true
          fi
          KSU_PATCH=$(find ../susfs4ksu/kernel_patches/KernelSU -maxdepth 1 -name "10_enable_susfs_*.patch" | head -n 1)
          if [ -n "$KSU_PATCH" ]; then
            if [ -d KernelSU-Next ]; then
              patch -d KernelSU-Next -p1 --fuzz=3 < "$KSU_PATCH" || true
            elif [ -d drivers/kernelsu ]; then
              patch -d drivers/kernelsu -p1 --fuzz=3 < "$KSU_PATCH" || true
            fi
          fi

      - name: Integrate Kali NetHunter Patches (5.15)
        run: |
          git clone --depth=1 https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel.git ../nh-kernel
          find ../nh-kernel -path "*5.15*" -name "*.patch" -exec sh -c 'echo "Applying $1..."; patch -p1 --fuzz=3 < "$1" || true' _ {} \;

      - name: Stub Out External Oplus Kconfig References
        run: |
          python3 - << 'EOF'
          import os
          for root, _, files in os.walk("."):
              if ".git" in root or root.startswith("./out"):
                  continue
              for fn in files:
                  if not fn.startswith("Kconfig"):
                      continue
                  path = os.path.join(root, fn)
                  with open(path, "r", errors="ignore") as f:
                      lines = f.readlines()
                  changed = False
                  out_lines = []
                  for line in lines:
                      indent = len(line) - len(line.lstrip())
                      stripped = line.lstrip()
                      if indent == 0 and (stripped.startswith("source ") or stripped.startswith("rsource ")):
                          parts = stripped.split()
                          if len(parts) >= 2:
                              inc = parts[1].strip('"').strip("'")
                              rel = os.path.join(root, inc) if stripped.startswith("rsource ") else inc
                              if not os.path.exists(inc) and not os.path.exists(rel):
                                  out_lines.append("# " + line)
                                  changed = True
                                  continue
                      out_lines.append(line)
                  if changed:
                      with open(path, "w") as f:
                          f.writelines(out_lines)
          EOF

      - name: Configure Kernel Defconfig
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/clang/bin:$PATH"
          mkdir -p out
          echo "Available configs:"
          find arch/arm64/configs -maxdepth 2 -type f

          if [ -f arch/arm64/configs/vendor/kalama_GKI.config ]; then
            make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
            ARCH=arm64 ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/kalama_GKI.config
          elif [ -f arch/arm64/configs/vendor/kalama_defconfig ]; then
            make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 vendor/kalama_defconfig
          elif [ -f arch/arm64/configs/kalama_defconfig ]; then
            make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 kalama_defconfig
          else
            make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          fi

          cat << 'EOF' >> out/.config
          CONFIG_64BIT=y
          CONFIG_ARM64=y
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_SQUASHFS=y
          CONFIG_SQUASHFS_FILE_CACHE=y
          CONFIG_SQUASHFS_DECOMP_MULTI_PERCPU=y
          CONFIG_SQUASHFS_XATTR=y
          CONFIG_SQUASHFS_ZLIB=y
          CONFIG_SQUASHFS_LZ4=y
          CONFIG_SQUASHFS_LZO=y
          CONFIG_SQUASHFS_XZ=y
          CONFIG_SQUASHFS_ZSTD=y
          CONFIG_OVERLAY_FS=y
          CONFIG_BLK_DEV_LOOP=y
          CONFIG_EXFAT_FS=y
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_F_MASS_STORAGE=y
          CONFIG_USB_G_HID=y
          CONFIG_CFG80211=y
          CONFIG_MAC80211=y
          CONFIG_MAC80211_MESH=y
          CONFIG_CFG80211_WEXT=y
          CONFIG_ATH9K_HTC=m
          CONFIG_ATH10K=m
          CONFIG_RT2800USB=m
          CONFIG_RTL8187=m
          CONFIG_RTL88XXAU=m
          CONFIG_MT7601U=m
          CONFIG_MT76x2U=m
          CONFIG_BT_HCIBTUSB=m
          CONFIG_BT_HCIUART=m
          CONFIG_USB_SERIAL=m
          CONFIG_USB_SERIAL_CH341=m
          CONFIG_USB_SERIAL_CP210X=m
          CONFIG_USB_SERIAL_FTDI_SIO=m
          CONFIG_USB_ACM=m
          CONFIG_USB_USBNET=m
          CONFIG_USB_NET_AX8817X=m
          CONFIG_USB_NET_AX88179_178A=m
          CONFIG_USB_RTL8152=m
          EOF

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          grep -E "CONFIG_64BIT|CONFIG_ARM64|CONFIG_KSU|CONFIG_SQUASHFS|CONFIG_OVERLAY_FS" out/.config || true

      - name: Compile Kernel Image & Modules (with ccache)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_COMPILERCHECK=content
          export PATH="/usr/lib/ccache:$HOME/clang/bin:$PATH"
          MAKE_ARGS="O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC='ccache clang' HOSTCC='ccache gcc' HOSTCXX='ccache g++' LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          if ! eval make -j$(nproc --all) $MAKE_ARGS Image modules; then
            echo "Parallel build failed; re-running single-threaded to capture exact error..."
            eval make -j1 $MAKE_ARGS Image modules
          fi
          ccache -s

      - name: Package modules.tar.gz
        run: |
          export ARCH=arm64
          export PATH="$HOME/clang/bin:$PATH"
          mkdir -p modules_out
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 INSTALL_MOD_PATH=$(pwd)/modules_out INSTALL_MOD_STRIP=1 modules_install
          tar -czvf modules.tar.gz -C modules_out .

      - name: Package into AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|block=auto;|g' anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=1;/g' anykernel.sh
          rm -rf .git
          zip -r9 ../OP11-crDroid12-KSUNext-SUSFS-NetHunter.zip *

      - name: Package NetHunter Wireless Firmware Module
        run: |
          git clone --depth=1 https://github.com/AyusmanNanda/nethunter-wireless-firmware-magisk-module.git nh-fw || true
          if [ -d nh-fw ]; then
            cd nh-fw && rm -rf .git && zip -r9 ../Nethunter-Wireless-Firmware.zip * && cd ..
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build KernelSU-Next Manager APK
        run: |
          KSU_DIR=""
          if [ -d KernelSU-Next/manager ]; then
            KSU_DIR="KernelSU-Next/manager"
          elif [ -d drivers/kernelsu/manager ]; then
            KSU_DIR="drivers/kernelsu/manager"
          fi
          if [ -n "$KSU_DIR" ]; then
            cd "$KSU_DIR"
            chmod +x gradlew
            ./gradlew assembleRelease
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            cp "$APK_PATH" "$GITHUB_WORKSPACE/ksun.apk"
          fi

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OP11-crDroid12-Full-Release-Bundle
          path: |
            OP11-crDroid12-KSUNext-SUSFS-NetHunter.zip
            modules.tar.gz
            Nethunter-Wireless-Firmware.zip
            ksun.apk
          if-no-files-found: warn

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OP11-crDroid12-KSUNext-SUSFS-NetHunter.zip
            modules.tar.gz
            Nethunter-Wireless-Firmware.zip
            ksun.apk
          body: |
            ### Post-Install — Verify & Finish Setup
            1. **Install Matching Manager:** Install `ksun.apk` from this release and confirm it reports **Working**.
            2. **Install SUSFS Userspace Module:** Flash `sidex15/susfs4ksu-module` in KernelSU-Next Manager and reboot.
            3. **Install Meta Module & Wireless Firmware:** Flash `NoMount` (or `Mountify`) alongside `Nethunter-Wireless-Firmware.zip` in KernelSU-Next Manager.
            4. **Load Extra `.ko` Drivers:** Extract `modules.tar.gz` and load external adapter modules via `insmod` as needed.
