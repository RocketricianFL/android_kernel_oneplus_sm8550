name: Build OP11 crDroid 16.0 Kernel (KSU-Next + SUSFS + NetHunter)

on:
  push:
    branches: [ "16.0" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Runner Disk Space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android

      - name: Install Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libelf-dev python3 python-is-python3 zip unzip wget zstd lz4 pahole openjdk-17-jdk

      - name: Checkout crDroid 16.0 Kernel Source
        uses: actions/checkout@v4
        with:
          ref: "16.0"
          submodules: recursive
          fetch-depth: 1

      - name: Download Proton Clang Toolchain
        uses: actions/checkout@v4
        with:
          repository: kdrag0n/proton-clang
          path: clang-toolchain
          fetch-depth: 1

      - name: Link Clang Toolchain
        run: mv clang-toolchain $HOME/clang

      - name: Integrate KernelSU-Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Integrate SUSFS (5.15)
        run: |
          git clone --depth=1 -b gki-android13-5.15 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
          cp -r ../susfs4ksu/kernel_patches/fs/* fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          SUSFS_PATCH=$(find ../susfs4ksu/kernel_patches -maxdepth 1 -name "50_add_susfs*.patch" | head -n 1)
          if [ -n "$SUSFS_PATCH" ]; then
            patch -p1 --fuzz=3 < "$SUSFS_PATCH" || true
          fi
          KSU_SUSFS_PATCH=$(find ../susfs4ksu/kernel_patches/KernelSU -name "10_enable_susfs*.patch" | head -n 1)
          if [ -n "$KSU_SUSFS_PATCH" ]; then
            if [ -d KernelSU-Next ]; then
              patch -d KernelSU-Next -p1 --fuzz=3 < "$KSU_SUSFS_PATCH" || true
            elif [ -d drivers/kernelsu ]; then
              patch -d drivers/kernelsu -p1 --fuzz=3 < "$KSU_SUSFS_PATCH" || true
            fi
          fi

      - name: Integrate Kali NetHunter Patches (5.15)
        run: |
          git clone --depth=1 https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel.git ../nh-kernel
          find ../nh-kernel -path "*5.15*" -name "*.patch" -exec sh -c 'patch -p1 --fuzz=3 < "$1" || true' _ {} \;

      - name: Stub Out External Oplus Kconfig References
        run: |
          python3 - << 'PYEOF'
          import os
          for root, _, files in os.walk('.'):
              if '/.git' in root or root.startswith('./out'):
                  continue
              for f in files:
                  if f.startswith('Kconfig'):
                      path = os.path.join(root, f)
                      with open(path, 'r', errors='ignore') as fp:
                          lines = fp.readlines()
                      changed = False
                      new_lines = []
                      for line in lines:
                          indent = len(line) - len(line.lstrip(' \t'))
                          stripped = line.strip()
                          if indent == 0 and (stripped.startswith('source ') or stripped.startswith('rsource ')):
                              parts = stripped.split()
                              if len(parts) >= 2:
                                  target = parts[1].strip(chr(34) + chr(39))
                                  rel_target = os.path.join(root, target) if stripped.startswith('rsource ') else target
                                  if not os.path.exists(rel_target):
                                      new_lines.append('# ' + line)
                                      changed = True
                                      continue
                          new_lines.append(line)
                      if changed:
                          with open(path, 'w') as fp:
                              fp.writelines(new_lines)
          PYEOF

      - name: Configure Kernel Defconfig
        run: |
          export ARCH=arm64 SUBARCH=arm64 PATH="$HOME/clang/bin:$PATH"
          mkdir -p out
          if [ -f arch/arm64/configs/vendor/kalama_GKI.config ]; then
            ./scripts/kconfig/merge_config.sh -m -O out arch/arm64/configs/gki_defconfig arch/arm64/configs/vendor/kalama_GKI.config
          else
            make O=out ARCH=arm64 gki_defconfig
          fi
          ./scripts/config --file out/.config \
            -e 64BIT -e ARM64 \
            -e KSU -e KPROBES \
            -e KSU_SUSFS -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT -e KSU_SUSFS_SUS_OVERLAYFS -e KSU_SUSFS_TRY_UMOUNT \
            -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_ENABLE_LOG -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e SQUASHFS -e SQUASHFS_XZ -e SQUASHFS_ZSTD -e OVERLAY_FS -e BLK_DEV_LOOP -e EXFAT_FS \
            -e USB_GADGET -e USB_CONFIGFS -e USB_CONFIGFS_F_HID -e USB_CONFIGFS_F_MASS_STORAGE -e USB_G_HID \
            -e CFG80211 -e MAC80211 -e MAC80211_MESH -e CFG80211_WEXT \
            -m ATH9K_HTC -m ATH10K -m RT2800USB -m RTL8187 -m RTL88XXAU -m MT7601U -m MT76x2U \
            -m BT_HCIBTUSB -e BT_HCIUART \
            -m USB_SERIAL -m USB_SERIAL_CH341 -m USB_SERIAL_CP210X -m USB_SERIAL_FTDI_SIO -m USB_ACM \
            -m USB_USBNET -m USB_NET_AX8817X -m USB_NET_AX88179_178A -m USB_RTL8152
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Compile Kernel Image & Modules
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang CROSS_COMPILE=aarch64-linux-gnu- Image modules || \
          make -j1 O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang CROSS_COMPILE=aarch64-linux-gnu- Image modules
          mkdir -p out/modules_stage
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 INSTALL_MOD_PATH=out/modules_stage INSTALL_MOD_STRIP=1 modules_install
          tar -czf modules.tar.gz -C out/modules_stage .

      - name: Package into AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|block=auto;|g' anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=1;/g' anykernel.sh
          rm -rf .git
          zip -r9 ../OP11-crDroid12-KSUNext-SUSFS-NetHunter.zip *

      - name: Package NetHunter Wireless Firmware Module
        run: |
          git clone --depth=1 https://github.com/AyusmanNanda/nethunter-wireless-firmware-magisk-module.git nh-fw
          cd nh-fw && rm -rf .git
          zip -r9 ../Nethunter-Wireless-Firmware.zip *

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build KernelSU-Next Manager APK
        run: |
          if [ -d KernelSU-Next/manager ]; then
            cd KernelSU-Next/manager
            chmod +x gradlew
            ./gradlew assembleRelease
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            cp "$APK_PATH" ../../ksun.apk
          fi

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OP11-crDroid12-Complete-Release
          path: |
            OP11-crDroid12-KSUNext-SUSFS-NetHunter.zip
            ksun.apk
            modules.tar.gz
            Nethunter-Wireless-Firmware.zip
            
