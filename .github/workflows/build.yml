name: Build OP11 crDroid 16.0 Kernel (KSU-Next + SUSFS + NetHunter)

permissions:
  contents: write

on:
  push:
    branches: [ "16.0" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libelf-dev python3 python-is-python3 zip unzip wget zstd lz4 pahole openjdk-17-jdk

      - name: Checkout crDroid 16.0 Kernel Source
        uses: actions/checkout@v4
        with:
          ref: "16.0"
          submodules: recursive
          fetch-depth: 1

      - name: Download Proton Clang Toolchain
        uses: actions/checkout@v4
        with:
          repository: kdrag0n/proton-clang
          path: clang-toolchain
          fetch-depth: 1

      - name: Link Clang Toolchain
        run: mv clang-toolchain $HOME/clang

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-op11-crdroid16-${{ github.sha }}
          restore-keys: |
            ccache-op11-crdroid16-

      - name: Integrate KernelSU-Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          if [ -d KernelSU-Next ]; then
            cd KernelSU-Next
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "next")
            git checkout "$LATEST_TAG" || true
            cd ..
          fi

      - name: Integrate SUSFS (5.15)
        run: |
          git clone --depth=1 -b gki-android13-5.15 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu || git clone --depth=1 -b kernel-5.15 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
          cp -r ../susfs4ksu/kernel_patches/fs/* fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          SUSFS_PATCH=$(find ../susfs4ksu/kernel_patches -maxdepth 1 -name "50_add_susfs_*.patch" | head -n 1)
          if [ -n "$SUSFS_PATCH" ]; then
            echo "Applying $SUSFS_PATCH..."
            patch -p1 --fuzz=3 < "$SUSFS_PATCH" || true
          fi
          KSU_SUSFS_PATCH=$(find ../susfs4ksu/kernel_patches/KernelSU -name "10_enable_susfs_*.patch" | head -n 1)
          if [ -n "$KSU_SUSFS_PATCH" ]; then
            if [ -d KernelSU-Next ]; then
              patch -d KernelSU-Next -p1 --fuzz=3 < "$KSU_SUSFS_PATCH" || true
            elif [ -d drivers/kernelsu ]; then
              patch -d drivers/kernelsu -p1 --fuzz=3 < "$KSU_SUSFS_PATCH" || true
            fi
          fi

      - name: Integrate Kali NetHunter Patches (5.15)
        run: |
          git clone --depth=1 https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel.git ../nh-kernel
          find ../nh-kernel -path "*5.15*" -name "*.patch" -exec sh -c 'patch -p1 --fuzz=3 < "$1" || true' _ {} \;

      - name: Stub Out External Oplus Kconfig References
        run: |
          python3 - << 'EOF'
          import os
          for root, _, files in os.walk("."):
              if ".git" in root or root.startswith("./out"):
                  continue
              for fn in files:
                  if not fn.startswith("Kconfig"):
                      continue
                  path = os.path.join(root, fn)
                  with open(path, "r", errors="ignore") as f:
                      lines = f.readlines()
                  changed = False
                  out_lines = []
                  for line in lines:
                      indent = len(line) - len(line.lstrip())
                      stripped = line.lstrip()
                      if indent == 0 and (stripped.startswith("source ") or stripped.startswith("rsource ")):
                          parts = stripped.split()
                          if len(parts) >= 2:
                              inc = parts[1].strip(""'")
                              rel = os.path.join(root, inc) if stripped.startswith("rsource ") else inc
                              if not os.path.exists(inc) and not os.path.exists(rel):
                                  out_lines.append("# " + line)
                                  changed = True
                                  continue
                      out_lines.append(line)
                  if changed:
                      with open(path, "w") as f:
                          f.writelines(out_lines)
          EOF

      - name: Configure Kernel Defconfig
        run: |
          mkdir -p out
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/clang/bin:$PATH"

          if [ -f arch/arm64/configs/vendor/kalama_defconfig ]; then
            make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 vendor/kalama_defconfig
          elif [ -f arch/arm64/configs/kalama_defconfig ]; then
            make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 kalama_defconfig
          elif [ -f arch/arm64/configs/gki_defconfig ]; then
            make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
            if [ -f arch/arm64/configs/vendor/kalama_GKI.config ]; then
              ARCH=arm64 ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/kalama_GKI.config
            fi
          else
            make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 defconfig
          fi

          # Speed up build: use ThinLTO instead of Full LTO and strip heavy debug symbols
          ./scripts/config --file out/.config             -e 64BIT -e ARM64             -d LTO_CLANG_FULL -e LTO_CLANG_THIN             -d DEBUG_INFO -d DEBUG_INFO_DWARF4 -d DEBUG_INFO_DWARF5 -d DEBUG_INFO_BTF

          # Enable KernelSU-Next, SUSFS, SquashFS, OverlayFS, and NetHunter
          ./scripts/config --file out/.config             -e KSU -e KPROBES             -e KSU_SUSFS -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT             -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT             -e KSU_SUSFS_SUS_KSTAT -e KSU_SUSFS_SUS_OVERLAYFS -e KSU_SUSFS_TRY_UMOUNT             -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_ENABLE_LOG             -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG             -e SQUASHFS -e SQUASHFS_XZ -e SQUASHFS_ZSTD -e OVERLAY_FS -e BLK_DEV_LOOP -e EXFAT_FS             -e USB_GADGET -e USB_CONFIGFS -e USB_CONFIGFS_F_HID -e USB_CONFIGFS_F_MASS_STORAGE -e USB_G_HID             -e CFG80211 -e MAC80211 -e MAC80211_MESH -e CFG80211_WEXT             -e MODULES -e MODULE_UNLOAD             -m ATH9K_HTC -m ATH10K -m RT2800USB -m RTL8187 -m MT7601U -m MT76x2U             -m BT_HCIBTUSB -e BT_HCIUART             -m USB_SERIAL -m USB_SERIAL_CH341 -m USB_SERIAL_CP210X -m USB_SERIAL_FTDI_SIO             -e USB_ACM -e USB_USBNET -m USB_NET_AX8817X -m USB_NET_AX88179_178A -m USB_RTL8152

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          grep -q "CONFIG_64BIT=y" out/.config

      - name: Compile Kernel Image & Modules
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CCACHE_DIR="$HOME/.ccache"
          ccache -M 5G
          MAKE_FLAGS="O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC="ccache clang" LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          set -o pipefail
          if ! eval make -j$(nproc --all) $MAKE_FLAGS Image modules 2>&1 | tee build.log; then
            echo "=== Build failed; extracting compiler errors ==="
            grep -iE "error:|fatal error:" build.log | tail -n 40 || tail -n 60 build.log
            exit 1
          fi
          ccache -s

      - name: Package modules.tar.gz
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          mkdir -p mod_out
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 INSTALL_MOD_PATH=$(pwd)/mod_out INSTALL_MOD_STRIP=1 modules_install
          tar -czf modules.tar.gz -C mod_out .

      - name: Package into AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|block=auto;|g' anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=1;/g' anykernel.sh
          rm -rf .git
          zip -r9 ../OP11-crDroid12-KSUNext-SUSFS-NetHunter.zip *

      - name: Bundle Nethunter-Wireless-Firmware.zip
        run: |
          git clone --depth=1 https://github.com/AyusmanNanda/nethunter-wireless-firmware-magisk-module.git nh-fw
          cd nh-fw && rm -rf .git
          zip -r9 ../Nethunter-Wireless-Firmware.zip *

      - name: Setup Android SDK for Manager APK
        uses: android-actions/setup-android@v3

      - name: Build KernelSU-Next Manager APK
        run: |
          MGR_DIR=""
          if [ -d KernelSU-Next/manager ]; then
            MGR_DIR="KernelSU-Next/manager"
          elif [ -d drivers/kernelsu/manager ]; then
            MGR_DIR="drivers/kernelsu/manager"
          fi
          if [ -n "$MGR_DIR" ]; then
            cd "$MGR_DIR"
            chmod +x gradlew
            ./gradlew assembleRelease
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
            "$APKSIGNER" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out ../../../ksun.apk "$APK_PATH"
          fi

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OP11-crDroid12-Release-Bundle
          path: |
            OP11-crDroid12-KSUNext-SUSFS-NetHunter.zip
            ksun.apk
            modules.tar.gz
            Nethunter-Wireless-Firmware.zip
          if-no-files-found: warn

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.15.211-${{ github.run_number }}
          name: OP11 crDroid 12 (5.15.211) KSU-Next + SUSFS + NetHunter #${{ github.run_number }}
          files: |
            OP11-crDroid12-KSUNext-SUSFS-NetHunter.zip
            ksun.apk
            modules.tar.gz
            Nethunter-Wireless-Firmware.zip
          fail_on_unmatched_files: false
