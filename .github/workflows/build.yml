name: Build OP11 crDroid 16.0 Kernel (KSU-Next + SUSFS + NetHunter)

permissions:
  contents: write

on:
  push:
    branches: [ "16.0" ]
  workflow_dispatch:
    inputs:
      enable_susfs:
        description: "Integrate SUSFS"
        type: boolean
        default: true
      enable_nethunter:
        description: "Apply NetHunter patches"
        type: boolean
        default: true
      localversion:
        description: "Kernel localversion -- MUST match the phone's stock kernel (Settings > About > Kernel version)"
        type: string
        default: "-g74d183918ec8"
      publish_release:
        description: "Publish a GitHub Release"
        type: boolean
        default: true

concurrency:
  group: op11-kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  SUBARCH: arm64
  ZIP_NAME: OP11-crDroid16-KSUNext-SUSFS-NetHunter
  # push events have no inputs -> default to true
  ENABLE_SUSFS: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_susfs }}
  ENABLE_NETHUNTER: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_nethunter }}
  # Device: OnePlus 11 5G NA (CPH2451 / OP594DL1), crDroid 16 BP4A.251205.006,
  # stock kernel 5.15.211-g74d183918ec8. vendor_dlkm/system_dlkm modules are built
  # against that exact release + symbol CRCs; any mismatch = no modules = bootloop.
  STOCK_LOCALVERSION: ${{ inputs.localversion || '-g74d183918ec8' }}
  PUBLISH_RELEASE: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_release }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          # Runner may already have an active /swapfile -> use a new path
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 16G /mnt/kswap
          sudo chmod 600 /mnt/kswap
          sudo mkswap /mnt/kswap
          sudo swapon /mnt/kswap
          free -h && df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          # NOTE: on Ubuntu 22.04 pahole ships in the "dwarves" package
          sudo apt-get install -y bc bison build-essential ccache curl flex git \
            libssl-dev libelf-dev python3 python-is-python3 zip unzip wget zstd lz4 \
            dwarves cpio rsync kmod

      - name: Checkout crDroid 16.0 Kernel Source
        uses: actions/checkout@v4
        with:
          ref: "16.0"
          submodules: recursive
          fetch-depth: 1

      # The kernel's Oplus drivers / headers / DTS are symlinks into these sibling
      # repos (../sm8550-modules, ../sm8550-devicetrees), exactly like the crDroid
      # source tree layout. Without them, oplus headers are missing at compile time.
      - name: Checkout crDroid sm8550-modules and devicetrees (sibling repos)
        run: |
          cd "$GITHUB_WORKSPACE/.."
          rm -rf sm8550-modules sm8550-devicetrees
          git clone --depth=1 -b 16.0 https://github.com/crdroidandroid/android_kernel_oneplus_sm8550-modules.git sm8550-modules
          git clone --depth=1 -b 16.0 https://github.com/crdroidandroid/android_kernel_oneplus_sm8550-devicetrees.git sm8550-devicetrees
          cd "$GITHUB_WORKSPACE"
          test -f drivers/power/oplus/v2/include/oplus_audio_switch.h
          broken=$(find . -path ./.git -prune -o -xtype l -print | grep -v "^./KernelSU" | head -20)
          if [ -n "$broken" ]; then echo "::warning::Still-broken symlinks:"; echo "$broken"; fi

      # AOSP Clang r450784e -- the exact compiler in build.config.constants that built the
      # stock 5.15.211-g74d183918ec8 kernel and vendor_dlkm modules. CONFIG_CFI_CLANG=y, so a
      # different compiler (e.g. Proton Clang) yields CFI type mismatches -> panic -> bootloop.
      - name: Download AOSP Clang r450784e
        run: |
          set -e
          mkdir -p "$HOME/clang"
          curl -fLSs --retry 3 "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2022/clang-r450784e.tar.gz" | tar -xz -C "$HOME/clang"
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          "$HOME/clang/bin/clang" --version | head -1
          "$HOME/clang/bin/clang" --version | grep -q "450784" || { echo "::error::wrong clang"; exit 1; }

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-op11-crdroid16-r450784e-${{ github.sha }}
          restore-keys: |
            ccache-op11-crdroid16-r450784e-

      - name: Integrate KernelSU-Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s
          test -d KernelSU-Next
          test -e drivers/kernelsu
          grep -q kernelsu drivers/Kconfig
          grep -q kernelsu drivers/Makefile

      - name: Integrate SUSFS (android13-5.15)
        if: env.ENABLE_SUSFS == 'true'
        run: |
          set -e
          git clone --depth=1 -b gki-android13-5.15 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
          cp -r ../susfs4ksu/kernel_patches/fs/* fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/

          ok=1
          SUSFS_PATCH=$(find ../susfs4ksu/kernel_patches -maxdepth 1 -name "50_add_susfs_*.patch" | head -n 1)
          if [ -n "$SUSFS_PATCH" ] && patch -p1 --dry-run --fuzz=3 -s < "$SUSFS_PATCH" >/dev/null; then
            patch -p1 --fuzz=3 --no-backup-if-mismatch < "$SUSFS_PATCH"
          else
            echo "::warning::SUSFS kernel patch does not apply cleanly to this tree"
            ok=0
          fi

          KSU_PATCH=$(find ../susfs4ksu/kernel_patches/KernelSU -name "10_enable_susfs_*.patch" | head -n 1)
          if [ "$ok" = 1 ] && [ -n "$KSU_PATCH" ] && patch -d KernelSU-Next -p1 --dry-run --fuzz=3 -s < "$KSU_PATCH" >/dev/null; then
            patch -d KernelSU-Next -p1 --fuzz=3 --no-backup-if-mismatch < "$KSU_PATCH"
          else
            echo "::warning::SUSFS KernelSU patch does not apply to KernelSU-Next (it targets upstream KernelSU)"
            ok=0
          fi

          if [ "$ok" = 1 ]; then
            echo "SUSFS_OK=1" >> "$GITHUB_ENV"
          else
            # Revert anything partially applied so the tree still compiles
            echo "::warning::SUSFS disabled for this build; kernel will be built with KernelSU-Next only"
            git checkout -- fs include || true
            git clean -fdq fs include || true
            echo "SUSFS_OK=0" >> "$GITHUB_ENV"
          fi

      - name: Integrate Kali NetHunter Patches (5.15)
        if: env.ENABLE_NETHUNTER == 'true'
        run: |
          git clone --depth=1 https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel.git ../nh-kernel || {
            echo "::warning::NetHunter patch repo unavailable, skipping"; exit 0; }
          applied=0; skipped=0
          while IFS= read -r p; do
            if patch -p1 -N --dry-run -s < "$p" >/dev/null 2>&1; then
              patch -p1 -N --no-backup-if-mismatch -s < "$p" && applied=$((applied+1))
              echo "applied: $p"
            else
              skipped=$((skipped+1))
              echo "skipped: $p"
            fi
          done < <(find ../nh-kernel -path "*5.15*" -name "*.patch" | sort)
          echo "NetHunter patches applied=$applied skipped=$skipped"
          if find . -name "*.rej" -not -path "./.git/*" | grep -q .; then
            echo "::error::Rejected hunks found"; find . -name "*.rej"; exit 1
          fi

      - name: Stub Out Missing Oplus Kconfig References
        run: |
          python3 - << 'EOF'
          import os
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in (".git", "out")]
              for fn in files:
                  if not fn.startswith("Kconfig"):
                      continue
                  path = os.path.join(root, fn)
                  with open(path, "r", errors="ignore") as f:
                      lines = f.readlines()
                  changed, out_lines = False, []
                  for line in lines:
                      # Only real Kconfig directives: column 0, quoted path.
                      # (Indented lines may be help text like "source code ...")
                      if line.startswith(("source ", "rsource ", "osource ", "orsource ")):
                          parts = line.split()
                          if len(parts) >= 2 and parts[1][:1] in ("\"", "'"):
                              inc = parts[1].strip("\"'")
                              rel = os.path.join(root, inc)
                              if "$" not in inc and not os.path.exists(inc) and not os.path.exists(rel):
                                  print(f"stubbed: {path}: {inc}")
                                  out_lines.append("# " + line)
                                  changed = True
                                  continue
                      out_lines.append(line)
                  if changed:
                      with open(path, "w") as f:
                          f.writelines(out_lines)
          EOF

      - name: Configure Kernel Defconfig
        run: |
          set -e
          M=(make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang CROSS_COMPILE=aarch64-linux-gnu- LOCALVERSION=)
          mkdir -p out

          # Same base config as the working v32 build: gki_defconfig + vendor fragments
          FRAGS="arch/arm64/configs/gki_defconfig"
          for f in arch/arm64/configs/vendor/kalama_GKI.config \
                   arch/arm64/configs/vendor/oplus/kalama_GKI.config \
                   arch/arm64/configs/vendor/debugfs.config; do
            if [ -f "$f" ]; then FRAGS="$FRAGS $f"; fi
          done
          echo "Config fragments: $FRAGS"
          ARCH=arm64 LLVM=1 CC=clang ./scripts/kconfig/merge_config.sh -m -O out $FRAGS
          "${M[@]}" olddefconfig
          cp out/.config baseline.config

          # system_dlkm GKI modules are signed with crDroid's private build key, which a
          # rebuilt kernel cannot have. With MODULE_SIG_PROTECT=y they fail sig check and
          # are refused ("exporting protected symbol") -> cascading module failures -> bootloop.
          # Turning it off lets them load as unsigned (sig_ok stays in struct module, so ABI is unchanged).
          ./scripts/config --file out/.config -d MODULE_SIG_PROTECT

          # Pin kernel release to the stock string (no -gHASH / -dirty / +)
          ./scripts/config --file out/.config -d LOCALVERSION_AUTO \
            --set-str LOCALVERSION "$STOCK_LOCALVERSION"

          # Faster CI build: ThinLTO, no heavy debug info
          ./scripts/config --file out/.config \
            -d LTO_CLANG_FULL -e LTO_CLANG_THIN \
            -d DEBUG_INFO -d DEBUG_INFO_DWARF4 -d DEBUG_INFO_DWARF5 -d DEBUG_INFO_BTF

          # KernelSU-Next
          ./scripts/config --file out/.config -e KSU -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS

          # SUSFS (only if patches applied)
          if [ "${SUSFS_OK:-0}" = 1 ]; then
            ./scripts/config --file out/.config \
              -e KSU_SUSFS -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT \
              -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
              -e KSU_SUSFS_SUS_KSTAT -e KSU_SUSFS_SUS_OVERLAYFS -e KSU_SUSFS_TRY_UMOUNT \
              -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_ENABLE_LOG \
              -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          fi

          # NetHunter extras: ONLY add symbols that are currently unset, and only as
          # modules. Never flip an existing y/m (e.g. CFG80211/MAC80211/BT are GKI
          # modules in system_dlkm -- forcing =y breaks module loading at boot).
          for sym in ATH9K_HTC RT2X00 RT2800USB RTL8187 MT7601U MT76x2U BT_HCIBTUSB \
                     USB_SERIAL_CH341 USB_SERIAL_CP210X USB_SERIAL_FTDI_SIO \
                     USB_NET_AX8817X USB_NET_AX88179_178A USB_RTL8152 USB_CONFIGFS_F_HID; do
            if ! grep -qE "^CONFIG_${sym}=" baseline.config; then
              ./scripts/config --file out/.config -m "$sym"
            fi
          done

          "${M[@]}" olddefconfig
          grep -q "CONFIG_64BIT=y" out/.config
          ! grep -q "^CONFIG_MODULE_SIG_PROTECT=y" out/.config || { echo "::error::MODULE_SIG_PROTECT still on"; exit 1; }
          grep -q "CONFIG_KSU=y" out/.config || { echo "::error::CONFIG_KSU did not stick"; exit 1; }
          cp out/.config kernel.config

          # ABI guard: no pre-existing symbol may change state (y<->m, or removed)
          python3 - << 'PYEOF'
          import re,sys
          def load(p):
              d={}
              for l in open(p):
                  m=re.match(r'^CONFIG_(\w+)=(.*)$',l)
                  if m: d[m.group(1)]=m.group(2)
              return d
          b,f=load("baseline.config"),load("out/.config")
          allowed={"MODULE_SIG_PROTECT","LOCALVERSION","MODULE_SCMVERSION","LOCALVERSION_AUTO","LTO_CLANG_FULL","LTO_CLANG_THIN","LTO_CLANG","DEBUG_INFO","DEBUG_INFO_DWARF4","DEBUG_INFO_DWARF5","DEBUG_INFO_BTF","DEBUG_INFO_BTF_MODULES","DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT","DEBUG_INFO_REDUCED","DEBUG_INFO_COMPRESSED","DEBUG_INFO_SPLIT","PAHOLE_HAS_SPLIT_BTF","MODULE_ALLOW_BTF_MISMATCH","GDB_SCRIPTS"}
          bad=[f"{k}: {v} -> {f.get(k,'unset')}" for k,v in b.items() if k not in allowed and f.get(k)!=v and v in("y","m")]
          for x in bad: print("::error::config changed:",x)
          sys.exit(1 if bad else 0)
          PYEOF

      - name: Compile Kernel Image & Modules
        run: |
          export CCACHE_DIR="$HOME/.ccache"
          ccache -M 5G
          export CCACHE_COMPILERCHECK=content
          ccache -z
          # Same flags as the working v32 build
          M=(make -j"$(nproc --all)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1
             CC="ccache clang" HOSTCC="ccache gcc" HOSTCXX="ccache g++"
             CROSS_COMPILE=aarch64-linux-gnu- LOCALVERSION=)
          set -o pipefail
          if ! "${M[@]}" Image modules 2>&1 | tee build.log; then
            echo "=== Build failed; compiler errors ==="
            grep -iE "error:|fatal error:|undefined reference" build.log | tail -n 60 || tail -n 80 build.log
            exit 1
          fi
          ccache -s
          test -f out/arch/arm64/boot/Image
          REL=$(cat out/include/config/kernel.release)
          echo "Built kernel release: $REL"
          if [ "$REL" != "5.15.211${STOCK_LOCALVERSION}" ]; then
            echo "::error::kernel.release '$REL' != stock '5.15.211${STOCK_LOCALVERSION}' -- vendor modules would not load"; exit 1
          fi
          strings out/arch/arm64/boot/Image | grep -qx "$REL" || { echo "::error::release string not in Image"; exit 1; }
          echo "KVER=$(make -s kernelversion)" >> "$GITHUB_ENV"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            kernel.config
          if-no-files-found: ignore

      - name: Package modules.tar.gz
        run: |
          mkdir -p mod_out
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang CROSS_COMPILE=aarch64-linux-gnu- LOCALVERSION= \
            INSTALL_MOD_PATH="$(pwd)/mod_out" INSTALL_MOD_STRIP=1 DEPMOD=true modules_install
          tar -czf modules.tar.gz -C mod_out .

      - name: Package into AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          rm -rf .git .github README.md modules patch ramdisk
          # Write a GKI-style anykernel.sh (OP11 is A/B, kernel lives in boot)
          cat > anykernel.sh << 'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=OP11 crDroid 16 KSU-Next + SUSFS + NetHunter
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=OP5913L1
          device.name2=salami
          device.name3=CPH2449
          device.name4=CPH2447
          device.name5=PHB110
          device.name6=CPH2451
          device.name7=OP594DL1
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF
          sed -i 's/^          //' anykernel.sh
          zip -r9 "../${ZIP_NAME}.zip" * -x .gitignore

      - name: Bundle Nethunter-Wireless-Firmware.zip
        continue-on-error: true
        run: |
          git clone --depth=1 https://github.com/AyusmanNanda/nethunter-wireless-firmware-magisk-module.git nh-fw
          cd nh-fw && rm -rf .git
          zip -r9 ../Nethunter-Wireless-Firmware.zip *

      - name: Fetch KernelSU-Next Manager APK (prebuilt release)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo KernelSU-Next/KernelSU-Next --pattern "*.apk" --dir mgr --clobber
          APK=$(ls mgr/*.apk | grep -vi spoof | head -n 1)
          cp "$APK" ksun.apk

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}-${{ env.KVER }}-${{ github.run_number }}
          path: |
            ${{ env.ZIP_NAME }}.zip
            ksun.apk
            modules.tar.gz
            Nethunter-Wireless-Firmware.zip
            kernel.config
            baseline.config
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: env.PUBLISH_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.KVER }}-${{ github.run_number }}
          name: OP11 crDroid 16 (${{ env.KVER }}) KSU-Next${{ env.SUSFS_OK == '1' && ' + SUSFS' || '' }} + NetHunter #${{ github.run_number }}
          files: |
            ${{ env.ZIP_NAME }}.zip
            ksun.apk
            modules.tar.gz
            Nethunter-Wireless-Firmware.zip
          fail_on_unmatched_files: false
